backend:
  name: git-gateway
  branch: main # لو الفرع الرئيسي للمشروع اسمه master، غير الكلمة دي لـ master

media_folder: "images" # الفولدر اللي هتترفع فيه صور المنتجات
public_folder: "/images"

collections:
  - name: "store_data"
    label: "إدارة المخزون والأسعار"
    files:
      - label: "بيانات المنتجات"
        name: "products"
        file: "data.json" # ده الملف اللي هيتخزن فيه الأسعار والكميات
        fields:
          - label: "قائمة المنتجات"
            name: "items"
            widget: "list"
            fields:
              - {label: "اسم المنتج", name: "name", widget: "string"}
              - {label: "الحجم", name: "size", widget: "string"}
              - {label: "السعر", name: "price", widget: "number"}
              - {label: "المخزون المتوفر", name: "stock", widget: "number"}
