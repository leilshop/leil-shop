backend:
  name: github
  repo: leilshop/leil-shop
  branch: main

# ده اللي بيخلي التعديل يتم جوه الموقع نفسه
collections:
  - name: "products"
    label: "المنتجات"
    folder: "products"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "الاسم", name: "name", widget: "string"}
      - {label: "السعر", name: "price", widget: "number"}
      - {label: "الكمية", name: "stock", widget: "number"}
