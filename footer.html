    }

    .leil-footer-contact {

        border-radius: 50px !important;
        color: white !important;
        text-decoration: none !important;
        font-size: 16px !important;
        font-weight: 700 !important;
        transition: all 0.3s ease !important;
    }
    .leil-whatsapp-btn:hover {
        background: rgba(255, 255, 255, 0.1) !important; 
        border-color: rgba(255, 255, 255, 0.8) !important;
        transform: scale(1.05) !important;
    }

    /* القسم الثالث: السوشيال ميديا (أقصى اليسار) */
    .leil-footer-socials {
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important; 
        justify-self: end !important; 
    }
    .leil-social-icons {
        display: flex !important;
        gap: 12px !important;
    }
    .leil-social-icon {
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        width: 42px !important;
        height: 42px !important;
        background: transparent !important;
        border: 1px solid rgba(255, 255, 255, 0.3) !important;
        border-radius: 50% !important;
        color: white !important;
        transition: all 0.3s ease !important;
    }
    .leil-social-icon:hover {
        background: rgba(255, 255, 255, 0.1) !important;
        transform: scale(1.1) !important;
        border-color: rgba(255, 255, 255, 0.8) !important;
    }

    /* شريط الحقوق السفلي */
    .leil-footer-bottom {
        text-align: center !important;
        margin-top: 40px !important;
        padding-top: 20px !important;
        border-top: 1px solid rgba(255, 255, 255, 0.1) !important;
        font-size: 14px !important;
        color: rgba(255, 255, 255, 0.6) !important;
        line-height: 1.8 !important;
    }
    .leil-tax-number {
        display: block !important;
        font-size: 13px !important;
        color: rgba(255, 255, 255, 0.5) !important;
        margin-top: 5px !important;
        font-family: inherit !important; 
    }

    /* 📱 تجاوب الفوتر مع الموبايل */
    @media (max-width: 768px) {
        .leil-footer {
            padding: 40px 5% 20px !important; 
        }
        
        .leil-footer-container {
            display: flex !important; 
            flex-direction: column !important;
            gap: 35px !important; 
        }
        
        .leil-footer-brand {
            justify-content: center !important;
            margin-bottom: 25px !important; /* تم إضافة هذه المساحة لضبط المسافة تحت اللوجو */

            align-items: center !important;

            max-width: 250px !important;

        }
