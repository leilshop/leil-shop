<!DOCTYPE html>
<html lang="ar" dir="rtl">
<body>
    <div style="text-align:center; margin-top:50px; font-family:sans-serif;">
        <h2>بوابة ليل السرية</h2>
        <input type="password" id="pass" placeholder="دخل الباسورد">
        <button onclick="login()">دخول</button>
    </div>

    <script>
        function login() {
            // غير "2026" بالباسورد اللي يعجبك
            if(document.getElementById('pass').value === "123456") {
                localStorage.setItem('isAdmin', 'true');
                alert("تم التفعيل!");
                window.location.href = "/"; // هيرجعك للرئيسية
            } else {
                alert("باسورد غلط");
            }
        }
    </script>
</body>
</html>
